name: Notify Subscribers on New Notification

on:
  push:
    branches:
      - master
    paths:
      - 'data/notifications.json'
      - 'data/events.json'

jobs:
  send-emails:
    name: Send Email Alerts
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for git push

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd .github/scripts
          npm install

      - name: Send notification emails
        env:
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          CUSTOM_FROM_EMAIL:   ${{ secrets.CUSTOM_FROM_EMAIL }}
          GOOGLE_SHEET_ID:     ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          SITE_URL:            ${{ secrets.SITE_URL }}
          REPLY_TO_EMAIL:      ${{ secrets.REPLY_TO_EMAIL }}
        run: |
          cd .github/scripts
          node send-notifications.js

      - name: Commit and push sent IDs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/sent-ids.json
          git commit -m "chore: update sent notification tracking [skip ci]" || echo "No changes to commit"
          git push